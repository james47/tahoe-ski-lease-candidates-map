05 00:01）";

var map = L.map('map', {scrollWheelZoom:true}).setView([39.24,-120.16], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);

RESORTS.forEach(function(r){
  var measured = r[3], bg = measured ? '#202124' : '#6b7075', w = measured ? 118 : 132;
  L.marker([r[1], r[2]], {zIndexOffset: measured ? 1000 : 500,
    icon: L.divIcon({className:'', iconSize:[w,21], iconAnchor:[w/2,10],
    html:'<div style="background:'+bg+';color:#fff;font:700 10px/21px sans-serif;'+
         'text-align:center;border-radius:11px;border:2px solid #fff;opacity:'+
         (measured?1:.82)+';box-shadow:0 1px 4px rgba(0,0,0,.4)">&#9968; '+r[0]+
         (measured?'':' <span style="font-weight:400">(参考)</span>')+'</div>'})})
   .addTo(map).bindPopup('<b>'+r[0]+'</b>');
});

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n){ return n==null ? null : '$'+Number(n).toLocaleString(); }
function row(k,v,cls){
  if(v===null||v===undefined||v==='') return '';
  return '<tr><td class="k">'+k+'</td><td'+(cls?' class="'+cls+'"':'')+'>'+v+'</td></tr>';
}
function baseOf(s){ return String(s||'').split(/\s*[-\u2013\uff0d]\s*/)[0].trim(); }
function colorOf(d){ return COLOR[d.base || baseOf(d.status)] || DEFCOLOR; }
function colorOfStatus(s){ return COLOR[baseOf(s)] || DEFCOLOR; }

function driveHtml(d){
  if(!d.drive) return '';
  return Object.keys(d.drive).map(function(k){
    return esc(k)+' '+d.drive[k]+'分';
  }).join(' &middot; ');
}

function popupHtml(d){
  var t = '<div class="lp"><h3>'+
    (d.url ? '<a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.name)+'</a>'
           : esc(d.name))+
    ' <span class="tg" style="background:'+colorOf(d)+'">'+esc(d.status)+'</span></h3>'+
    '<div class="loc">'+esc([d.area, d.address].filter(Boolean).join(' &middot; '))+
    (d.approx ? ' <span class="approx">(坐标是区域近似)</span>' : '')+'</div><table>';
  t += row('户型', esc(d.layout));
  t += row('床位', esc(d.beds));
  t += row('面积', d.sqft ? esc(d.sqft)+' sq ft' : '');
  t += row('月租', money(d.price));
  t += row('车位', esc(d.parking));
  t += row('车程', driveHtml(d));
  t += row('租期', esc(d.term));
  if(d.vote) t += row('投票', esc(d.vote));
  t += row('来源', esc(d.source));
  t += '</table>';
  if(d.verify && d.verify.length){
    t += '<table>'+row('待确认','<ul style="margin:2px 0 0;padding-left:15px">'+
      d.verify.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>','warn')+'</table>';
  }
  if(d.comment) t += '<div class="note">'+esc(d.comment)+'</div>';
  return t + '</div>';
}

var markers = {};
DATA.forEach(function(d, i){
  d._i = i;
  var mk = L.circleMarker([d.lat, d.lon], {
      radius: d.approx ? 6 : 8, weight: d.approx ? 1.5 : 2, color:'#fff',
      fillColor: colorOf(d), fillOpacity: d.approx ? .55 : .92,
      dashArray: d.approx ? '2,2' : null})
    .addTo(map).bindPopup(popupHtml(d), {maxWidth:360});
  mk.on('click', function(){ select(i); });
  markers[i] = mk;
});

var statuses = [];
DATA.concat(UNPLACED).forEach(function(d){
  if(statuses.indexOf(d.status) < 0) statuses.push(d.status);
});
var active = {};
statuses.forEach(function(s){ active[s] = true; });

var fEl = document.getElementById('filters');
statuses.forEach(function(s){
  var n = DATA.concat(UNPLACED).filter(function(d){ return d.status===s; }).length;
  var l = document.createElement('label');
  l.innerHTML = '<input type="checkbox" checked data-s="'+esc(s)+'">'+
    '<span class="dot" style="background:'+colorOfStatus(s)+'"></span>'+
    esc(s)+' <span style="color:#5f6368">('+n+')</span>';
  l.querySelector('input').onchange = function(){ active[s] = this.checked; render(); };
  fEl.appendChild(l);
});

function matches(d){
  if(!active[d.status]) return false;
  var q = document.getElementById('q').value.trim().toLowerCase();
  if(!q) return true;
  return [d.name,d.area,d.address,d.comment,d.layout,d.beds,d.parking,d.term]
    .join(' ').toLowerCase().indexOf(q) >= 0;
}

function sortKey(d){
  var s = document.getElementById('sort').value;
  if(s==='price') return d.price==null ? 1e9 : d.price;
  if(s==='beds')  return d.bed_count==null ? 99 : -d.bed_count;
  if(s==='drive'){
    if(!d.drive) return 1e9;
    var p = d.drive.Palisades, n = d.drive.Northstar;
    if(p==null || n==null) return 1e9;
    return p + n;
  }
  return 0;
}

function select(i){
  var mk = markers[i];
  if(mk){ map.setView(mk.getLatLng(), Math.max(map.getZoom(), 13)); mk.openPopup(); }
  Array.prototype.forEach.call(document.querySelectorAll('.item'), function(el){
    el.classList.toggle('on', el.dataset.i === String(i));
  });
}

function render(){
  var shown = DATA.filter(matches);
  var s = document.getElementById('sort').value;
  if(s !== 'area') shown.sort(function(a,b){ return sortKey(a)-sortKey(b); });

  DATA.forEach(function(d){
    var mk = markers[d._i];
    if(shown.indexOf(d) >= 0){ if(!map.hasLayer(mk)) mk.addTo(map); }
    else if(map.hasLayer(mk)) map.removeLayer(mk);
  });

  var un = UNPLACED.filter(matches);
  var h = shown.map(function(d){
    return '<div class="item" data-i="'+d._i+'">'+
      '<span class="dot" style="background:'+colorOf(d)+';margin-top:3px"></span>'+
      '<div><div class="nm">'+esc(d.name)+'</div><div class="mt">'+
      esc([d.area, d.layout, d.beds, d.price?money(d.price)+'/月':''].filter(Boolean).join(' · '))+
      '</div></div></div>';
  }).join('');

  // Rows without coordinates are listed, never dropped: the count on the map has to
  // reconcile with the count in the spreadsheet, or the map quietly lies.
  if(un.length){
    h += '<div class="sec">未定位 ('+un.length+') — 没有地址，不在地图上</div>';
    h += un.map(function(d){
      return '<div class="item">'+
        '<span class="dot" style="background:'+colorOf(d)+';margin-top:3px"></span>'+
        '<div><div class="nm">'+esc(d.name)+'</div><div class="mt">'+
        esc(d.comment || d.source)+'</div></div></div>';
    }).join('');
  }
  document.getElementById('list').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('.item[data-i]'), function(el){
    el.onclick = function(){ select(Number(el.dataset.i)); };
  });
  document.getElementById('cnt').textContent =
    shown.length + ' / ' + (DATA.length + UNPLACED.length) + ' 个候选';
}

document.getElementById('q').oninput = render;
document.getElementById('sort').onchange = render;
document.getElementById('src').textContent = SRC;

var lg = L.control({position:'bottomright'});
lg.onAdd = function(){
  var d = L.DomUtil.create('div','lg');
  d.innerHTML = statuses.map(function(s){
    return '<div><span class="dot" style="background:'+colorOfStatus(s)+'"></span>'+esc(s)+'</div>';
  }).join('') + '<div style="margin-top:3px;color:#5f6368">虚线圈 = 坐标只到区域</div>';
  return d;
};
lg.addTo(map);

var fit = L.control({position:'topright'});
fit.onAdd = function(){
  var d = L.DomUtil.create('div','lg');
  d.innerHTML = '<a href="#" style="color:#1a73e8;text-decoration:none">缩放到全部</a>';
  d.onclick = function(e){
    e.preventDefault();
    var pts = DATA.filter(matches).map(function(d){ return [d.lat,d.lon]; });
    if(pts.length) map.fitBounds(pts, {padding:[40,40]});
  };
  return d;
};
fit.addTo(map);

render();
</script></body></html>
